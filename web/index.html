<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A12" />
    <meta name="description" content="AZOLVE CHAT — a smarter way to connect the world. AI-powered global social communication by AZOLVE INFOTECH." />
    <title>AZOLVE CHAT — A smarter way to connect the world</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="icon" href="./logo.svg" type="image/svg+xml" />
    <style>
      /* never show the hosting badge inside the product */
      #ninja-badge, .ninja-badge { display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; }

      html, body { margin: 0; background: #0A0A12; }
      #preboot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(120% 90% at 50% 0%, #1A1830 0%, #0A0A12 60%);
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #EDEDF5; z-index: 9999;
      }
      #preboot .ring {
        width: 64px; height: 64px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,.08);
        border-top-color: #8B7BFF; border-right-color: #5AC8FA;
        animation: prebootSpin .9s linear infinite;
      }
      #preboot .bar { width: 150px; height: 3px; border-radius: 99px; background: rgba(255,255,255,.09); overflow: hidden; }
      #preboot .bar i { display: block; width: 40%; height: 100%; border-radius: 99px; background: linear-gradient(90deg,#8B7BFF,#5AC8FA,#FF7AB6); animation: prebootSlide 1.1s ease-in-out infinite; }
      #preboot .nm { font-size: 12px; letter-spacing: .28em; font-weight: 700; opacity: .7; }
      @keyframes prebootSpin { to { transform: rotate(360deg); } }
      @keyframes prebootSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
    </style>
  <script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
  <body>
    <div id="root">
      <div id="preboot">
        <div class="ring"></div>
        <div class="nm">AZOLVE CHAT</div>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
