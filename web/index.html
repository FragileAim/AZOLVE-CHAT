<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F6FA" />
    <!-- Apply the saved theme before first paint so there is no light flash for
         someone who chose dark, and no dark flash for the default bright UI. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('azolve.theme') || 'light';
          var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          var t = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', dark ? '#0A0A12' : '#F6F6FA');
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="AZOLVE CHAT — a smarter way to connect the world. AI-powered global social communication by AZOLVE INFOTECH." />
    <title>AZOLVE CHAT — A smarter way to connect the world</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="icon" href="./logo.svg" type="image/svg+xml" />

    <!-- Installable app: Chrome/Edge/Android use the manifest, iOS uses the
         apple-* tags below. Without these, "Add to Home Screen" on an iPhone
         produces a screenshot icon inside a Safari-chrome window instead of a
         real full-screen app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/ios/apple-touch-icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/ios/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/ios/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/ios/apple-touch-icon-120.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AZOLVE" />
    <meta name="application-name" content="AZOLVE CHAT" />
    <meta name="format-detection" content="telephone=no" />

    <!-- iOS launch images, so opening the installed app does not flash white. -->
    <link rel="apple-touch-startup-image" href="/ios/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/ios/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/ios/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/ios/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/ios/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/ios/splash-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/ios/splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/ios/splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/ios/splash-640x1136.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)" />
    <style>
      /* never show the hosting badge inside the product */
      #ninja-badge, .ninja-badge { display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; }

      html, body { margin: 0; background: #07070C; }
      /* First paint before React mounts. It deliberately mirrors the native
         Android splash and the React <Splash/> exactly — same wordmark, same
         teal accent, same tagline, same thin progress line — so the four
         handovers read as one continuous loading screen instead of four
         different designs flashing past. */
      #preboot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #07070C;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #EDEDF5; z-index: 9999;
      }
      #preboot .word { font-size: 34px; font-weight: 800; letter-spacing: .22em; color: #fff; }
      #preboot .sub { font-size: 13px; font-weight: 800; letter-spacing: .52em; color: #18E0C8; margin-top: 6px; }
      #preboot .tag { font-size: 12px; color: #8A8AA0; margin-top: 18px; }
      #preboot .bar { width: 120px; height: 2px; margin-top: 26px; border-radius: 99px; background: rgba(255,255,255,.10); overflow: hidden; }
      #preboot .bar i { display: block; width: 40%; height: 100%; border-radius: 99px; background: linear-gradient(90deg,#6D5EF8,#18E0C8); animation: prebootSlide 1.15s ease-in-out infinite; }
      @keyframes prebootSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
    </style>
</head>
  <body>
    <div id="root">
      <div id="preboot">
        <div class="word">AZOLVE</div>
        <div class="sub">CHAT</div>
        <div class="tag">Every language. One conversation.</div>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
