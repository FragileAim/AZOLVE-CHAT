plugins {
    id 'com.android.application'
}

android {
    namespace 'io.azolve.chat'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "io.azolve.chat"
        minSdk 24
        targetSdk 34
        versionCode 16
        versionName "1.1.5"
        // -PappUrl=https://your-app.onrender.com  → app talks to your real backend.
        buildConfigField "String", "APP_URL", "\"${project.findProperty('appUrl') ?: ''}\""
    }

    signingConfigs {
        debug {
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    // Intentionally none: the shell is a plain android.app.Activity + WebView so the APK
    // stays tiny and has no Kotlin/AndroidX transitive baggage.
}
