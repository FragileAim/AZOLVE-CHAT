plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'io.azolve.chat'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "io.azolve.chat"
        minSdk 24
        targetSdk 34
        versionCode 18
        versionName "1.1.7"
        // -PappUrl=https://your-app.onrender.com  → app talks to your real backend.
        buildConfigField "String", "APP_URL", "\"${project.findProperty('appUrl') ?: ''}\""
    }

    signingConfigs {
        debug {
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    // Firebase Cloud Messaging only. The shell stays a plain Activity + WebView;
    // FCM is the one thing a WebView genuinely cannot do, because the browser
    // Push API does not exist inside one. Everything else stays hand-rolled.
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
}
