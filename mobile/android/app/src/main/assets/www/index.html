    <!-- Apply the saved theme before first paint so there is no light flash for
         someone who chose dark, and no dark flash for the default bright UI. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('azolve.theme') || 'light';
          var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          var t = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', dark ? '#0A0A12' : '#F6F6FA');
        } catch (e) {}
      })();
    </script>
