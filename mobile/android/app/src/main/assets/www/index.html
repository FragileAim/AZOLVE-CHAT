<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A0A12" />
<title>AZOLVE CHAT — Offline</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #07070C; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 32px 24px calc(32px + env(safe-area-inset-bottom));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    color: #EDEDF5; text-align: center;
    background: radial-gradient(130% 90% at 50% 0%, #1A1830 0%, #07070C 62%);
  }
  .wrap { width: 100%; max-width: 380px; }
  .mark {
    width: 78px; height: 78px; margin: 0 auto 26px; border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #6D5EF8 0%, #4F8CFF 52%, #18E0C8 100%);
    box-shadow: 0 18px 44px rgba(109, 94, 248, .38);
    font-size: 40px; font-weight: 800; letter-spacing: -.04em; color: #fff;
  }
  h1 { font-size: 23px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 10px; }
  p { font-size: 15px; line-height: 1.6; color: #A6A6BC; margin: 0 0 26px; }
  button {
    width: 100%; height: 52px; border: 0; border-radius: 14px; cursor: pointer;
    font-size: 16px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, #6D5EF8, #4F8CFF);
    box-shadow: 0 10px 26px rgba(109, 94, 248, .34);
  }
  button:active { transform: translateY(1px); }
  .foot { margin-top: 26px; font-size: 11.5px; letter-spacing: .16em; color: #565670; text-transform: uppercase; }
</style>
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="mark">A</div>
    <h1>Can't reach AZOLVE CHAT</h1>
    <p>This device looks offline, or the server is waking up. Check your connection and try again — the first load after a quiet period can take up to a minute.</p>
    <button onclick="location.replace('https://azolve-chat.onrender.com/?splash=0')">Try again</button>
    <div class="foot">AZOLVE INFOTECH</div>
  </div>
</body>
</html>
