# =============================================================================
#  AZOLVE CHAT - edge configuration
#
#  Terminates TLS, forwards WebSocket upgrades for Socket.IO, and applies the
#  header hardening a government security review will ask about.
#
#  Two listeners:
#    80   redirects to 443 (except /healthz, so an internal LB can probe it)
#    443  the application
# =============================================================================

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not advertise the exact nginx version.
    server_tokens off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 75s;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # File attachments are capped at 25 MB by the application; leave a little
    # headroom for multipart overhead so nginx does not reject them first.
    client_max_body_size 30m;

    # Real client IP behind the ministry's load balancer. Extend this list with
    # the LB addresses actually in use.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Socket.IO needs the Upgrade header forwarded, and the connection kept
    # open. Without this map, long-lived connections are downgraded to polling
    # and calls / live translation captions stop arriving promptly.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Brute-force protection on the authentication endpoints. The application
    # also rate limits, but doing it here stops the traffic before it reaches
    # Node at all.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml;

    upstream azolve_app {
        server app:3000;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # Port 80 - redirect only
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # Port 443 - the application
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # TLS 1.2 is kept only for older Android handsets still in circulation
        # on government-issued devices; drop it if the client's policy allows.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

        # The app is a single-page bundle; a strict CSP would need the exact
        # inline-script hashes Vite emits. This is the permissive-but-useful
        # baseline: no framing by third parties, no plugins, no eval.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' wss: https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

        limit_conn conn 40;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Socket.IO: long-lived, must not be buffered or timed out.
        location /socket.io/ {
            proxy_pass http://azolve_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # OTP / login endpoints get the tight bucket.
        location ~ ^/api/auth/(login|signup|otp|phone|email|forgot|reset) {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://azolve_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://azolve_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Uploaded media is immutable once written; cache it at the edge.
        location /uploads/ {
            proxy_pass http://azolve_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_valid 200 7d;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # Hashed asset filenames: safe to cache forever.
        location /assets/ {
            proxy_pass http://azolve_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            proxy_pass http://azolve_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
